@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--ink:#eef2ef;--mute:#9aa8a0;--acc:#3ec99e;--acc2:#1f332c;--bd:#2c3a34}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--ink:#eef2ef;--mute:#9aa8a0;--acc:#3ec99e;--acc2:#1f332c;--bd:#2c3a34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 18px}
input{width:100%;font-size:1.15rem;padding:14px 16px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--ink);direction:ltr;text-align:left;outline:none}
input:focus{border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:16px;text-align:center}
.en{color:var(--mute);direction:ltr;font-size:1rem}
.ar{font-size:3rem;font-weight:700;margin:6px 0;line-height:1.3}
.rom{font-size:1.4rem;color:var(--acc);direction:ltr;font-weight:600}
.lbl{font-size:.8rem;color:var(--mute);margin-top:2px}
button{font:inherit;cursor:pointer}
.say{margin-top:14px;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 22px}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sug button,.chip{background:var(--card);border:1px solid var(--bd);color:var(--ink);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px}
.sug .l{direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;direction:ltr}
h2{font-size:1rem;color:var(--mute);margin:26px 0 0}
.ask{width:100%;margin-top:12px;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px}.note{margin-top:12px;color:var(--mute);font-size:.95rem;border-top:1px solid var(--bd);padding-top:12px}
.msg{margin-top:16px;color:var(--mute);text-align:center}
</style>

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u064B-\u065F\u0640\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/ى/g,"ي").replace(/ة/g,"ه").trim();
const dm={};DE.split(";").forEach(p=>{const [k,v]=p.split("=");dm[k.trim()]=v.trim()});
const D=RAW.split("\n").map(l=>{const [e,a,r]=l.split("|");return{e,a,r,d:dm[e]||""}}).concat(EXTRA.split("\n").map(l=>{const [e,a,r,d]=l.split("|");return{e,a,r,d}}));
D.forEach(w=>{w.k=[norm(w.e),norm(w.d),norm(w.a)]});
const find=t=>D.find(w=>w.k.includes(t));
const ALIAS={thanks:"thank you",bye:"goodbye",hi:"hello",hey:"hello",thx:"thank you",automobile:"car",kid:"child",mom:"mother",dad:"father",buy:"price"};
const q=document.getElementById("q"),out=document.getElementById("out");
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function show(w){
  out.innerHTML=`<div class="card"><div class="en">${esc(w.e)}${w.d?` · <span lang="de">${esc(w.d)}</span>`:""}</div><div class="ar">${w.a}</div><div class="rom">${esc(w.r)}</div><div class="lbl">النطق بالحروف اللاتينية</div>${w.n?`<div class="note">${esc(w.n)}</div>`:""}<button class="say" id="say">🔊 استمع للنطق</button></div>`;
  document.getElementById("say").onclick=()=>speak(w.a);
}
function run(){
  let t=norm(q.value);
  if(!t){out.innerHTML="";return}
  t=ALIAS[t]||t;
  const ex=find(t);
  if(ex){show(ex);return}
  const m=D.filter(w=>w.k.some(x=>x.startsWith(t))).concat(D.filter(w=>!w.k.some(x=>x.startsWith(t))&&w.k.some(x=>x.includes(t)))).slice(0,8);
  if(!m.length){out.innerHTML=askBtn(q.value.trim());bindAsk();return}
  out.innerHTML=`<div class="sug">`+m.map((w,i)=>`<button data-i="${i}"><span class="l">${esc(w.e)}${w.d?" · "+esc(w.d):""}</span><span>${w.a}</span></button>`).join("")+`</div>`+askBtn(q.value.trim());
  out.querySelectorAll(".sug button").forEach(b=>b.onclick=()=>{show(m[+b.dataset.i]);q.value=m[+b.dataset.i].e});
  bindAsk();
}
function askBtn(t){return `<button class="ask" id="ask">✨ ترجم «${esc(t)}» بواسطة Claude</button>`}
function bindAsk(){const b=document.getElementById("ask");if(b)b.onclick=ask}
let busy=false;
async function ask(){
  const t=q.value.trim();if(!t||busy)return;
  busy=true;out.innerHTML=`<div class="msg">جارٍ الترجمة…</div>`;
  try{
    const sample=await claude.use("sample");
    if(!sample){out.innerHTML=`<div class="msg">خاصية Claude غير متاحة في هذا العرض.</div>`;busy=false;return}
    const r=await sample.json("You are an Arabic dictionary for learners. Input word or short phrase (any language): "+JSON.stringify(t)+". Reply with JSON only, no extra text: {\"e\":\"the input in English (if the input is Arabic, give its English meaning)\",\"d\":\"German translation\",\"a\":\"the Arabic translation, most common form, with diacritics only if needed\",\"r\":\"simple readable pronunciation in Latin letters, e.g. marhaban or ma'\",\"n\":\"one or two short sentences IN ARABIC: part of speech, useful tip, and one simple Arabic example sentence followed by its Latin pronunciation in parentheses\"}");
    if(!r||!r.a)throw new Error("empty");
    show({e:r.e||t,d:r.d||"",a:r.a,r:r.r||"",n:r.n||""});
  }catch(err){
    out.innerHTML=`<div class="msg">${err&&err.code==="rate_limited"?"طلبات كثيرة، انتظر قليلا ثم حاول مرة أخرى.":"تعذّرت الترجمة الآن، حاول مرة أخرى."}</div>`+askBtn(t);bindAsk();
  }
  busy=false;
}
q.addEventListener("input",run);
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const t=norm(q.value);if(t&&!find(ALIAS[t]||t))ask()}});
const ch=document.getElementById("chips");
["hello","thank you","water","friend","love","good morning","book","car","today","how much"].forEach(e=>{
  const b=document.createElement("button");b.className="chip";b.textContent=e;
  b.onclick=()=>{q.value=e;run()};ch.appendChild(b);
});
