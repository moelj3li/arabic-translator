<title>قاموس تعلّم العربية</title>
<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--ink:#eef2ef;--mute:#9aa8a0;--acc:#3ec99e;--acc2:#1f332c;--bd:#2c3a34}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--ink:#eef2ef;--mute:#9aa8a0;--acc:#3ec99e;--acc2:#1f332c;--bd:#2c3a34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 18px}
input{width:100%;font-size:1.15rem;padding:14px 16px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--ink);direction:ltr;text-align:left;outline:none}
input:focus{border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:16px;text-align:center}
.en{color:var(--mute);direction:ltr;font-size:1rem}
.ar{font-size:3rem;font-weight:700;margin:6px 0;line-height:1.3}
.rom{font-size:1.4rem;color:var(--acc);direction:ltr;font-weight:600}
.lbl{font-size:.8rem;color:var(--mute);margin-top:2px}
button{font:inherit;cursor:pointer}
.say{margin-top:14px;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 22px}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sug button,.chip{background:var(--card);border:1px solid var(--bd);color:var(--ink);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px}
.sug .l{direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;direction:ltr}
h2{font-size:1rem;color:var(--mute);margin:26px 0 0}
.ask{width:100%;margin-top:12px;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px}.note{margin-top:12px;color:var(--mute);font-size:.95rem;border-top:1px solid var(--bd);padding-top:12px}
.msg{margin-top:16px;color:var(--mute);text-align:center}
.fam{margin-top:14px;text-align:right;border-top:1px solid var(--bd);padding-top:10px}
.fam summary{cursor:pointer;color:var(--acc);font-weight:600}
.fl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fi{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;text-align:right;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;color:var(--ink)}
.fa{font-size:1.25rem;font-weight:700}
.fr{color:var(--acc);direction:ltr}
.fe{flex-basis:100%;color:var(--mute);direction:ltr;text-align:left;font-size:.9rem}
.famb{margin-top:14px;background:var(--acc2);color:var(--acc);border:1px solid var(--bd);border-radius:999px;padding:8px 16px}
.langs{display:flex;gap:6px;justify-content:center;margin:0 0 12px}.langs button{background:var(--card);border:1px solid var(--bd);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:.9rem}.langs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}footer{margin-top:34px;text-align:center;color:var(--mute);font-size:.85rem}
[hidden]{display:none!important}
.modes{margin:-4px 0 12px}.modes button{background:var(--acc2);border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:6px 18px;font-weight:700}.modes button.on{background:var(--acc);color:#fff}
.tabs{display:flex;gap:8px;margin:8px 0 12px}.tabs button{flex:1;background:var(--card);border:2px solid var(--bd);color:var(--ink);border-radius:14px;padding:10px;font-weight:700}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.back{background:none;border:0;color:var(--acc);font-weight:700;padding:4px 0;margin-bottom:6px}
.sc .ar{font-size:1.9rem}.sc .say{padding:7px 16px;margin-top:10px}
#sd{padding-bottom:80px}
#sd .fam{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -4px 14px rgba(0,0,0,.1);z-index:20}
#sd .fam .fl{max-height:45vh;overflow:auto}
</style>
</head>
